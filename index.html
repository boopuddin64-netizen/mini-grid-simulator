<title>Mini-Grid EPC Simulator — Nigeria Edition</title>
<meta name="description" content="Solar mini-grid EPC delivery simulator for Nigeria. Training, operations and planning modes.">
<meta name="theme-color" content="#06110c">
<script>
  /* Apply the stored theme before first paint so light mode does not flash dark. */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem("mg_epc_prefs_v1") || "{}");
      var choice = p.theme || "dark";
      var theme = choice === "system"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : choice;
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
      document.documentElement.setAttribute("data-theme-choice", choice);
    } catch (err) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
